<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NivelTec - Tabela e Gráficos</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <!-- Chart.js Padrão (SEM plugins extras) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
  
  <style>
    body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #14532d, #1e3a8a); min-height: 100vh; }
    .card { background: rgba(255, 255, 255, 0.95); border-radius: 1rem; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1); }
  </style>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
</head>
<body class="min-h-screen flex flex-col">
  <div class="container mx-auto px-4 py-8 flex-grow">
    
    <div class="flex flex-wrap justify-between items-center gap-4 mb-6">
      <div>
        <h1 class="text-3xl font-bold text-white">NivelTec</h1>
        <p class="text-white/80 text-sm">Histórico de medições e gráficos</p>
      </div>
      <div class="flex space-x-3">
        <button id="refreshBtn" class="bg-white/20 hover:bg-white/30 text-white px-4 py-2 rounded-lg transition"><i class="fas fa-sync-alt mr-2"></i> Atualizar</button>
        <button id="logoutBtn" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg transition"><i class="fas fa-sign-out-alt mr-2"></i> Sair</button>
      </div>
    </div>

    <!-- Gráfico -->
    <div class="card p-5 mb-6">
      <h3 class="text-xl font-semibold text-gray-800 mb-4 flex items-center">
        <i class="fas fa-chart-line text-purple-600 mr-2"></i> Evolução do Nível d'água
      </h3>
      <div class="chart-container" style="position: relative; height: 400px;">
        <canvas id="nivelChart"></canvas>
      </div>
      <div class="text-xs text-gray-500 text-center mt-2">
        A faixa roxa sombreada representa a incerteza (± sigma).
      </div>
    </div>

    <!-- Tabela -->
    <div class="card p-5">
      <div class="flex justify-between items-center mb-4 flex-wrap gap-3">
        <h3 class="text-xl font-semibold text-gray-800">Medições Registradas</h3>
        <div class="flex space-x-2">
          <button id="apagarHistoricoBtn" class="bg-red-600 hover:bg-red-700 text-white font-semibold py-2 px-4 rounded-lg transition hidden">
            <i class="fas fa-trash-alt mr-2"></i> Apagar Histórico
          </button>
          <button id="exportCsvBtn" class="bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-4 rounded-lg transition">
            <i class="fas fa-download mr-2"></i> Exportar CSV
          </button>
        </div>
      </div>
      <div class="overflow-x-auto max-h-96">
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-50 sticky top-0">
             <tr>
              <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Data/Hora (UTC)</th>
              <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Sensor 1 (mm)</th>
              <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Sensor 2 (mm)</th>
              <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nível y (mm)</th>
             </tr>
          </thead>
          <tbody id="tabelaBody" class="bg-white divide-y divide-gray-200">
            <tr><td colspan="4" class="px-4 py-8 text-center text-gray-500">Carregando dados...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    const firebaseConfig = { apiKey: "AIzaSyCORs2eW8qDTYe6SBA8o65nMoRVMAzhYXQ", authDomain: "nivelbudo.firebaseapp.com", databaseURL: "https://nivelbudo-default-rtdb.firebaseio.com", projectId: "nivelbudo", storageBucket: "nivelbudo.firebasestorage.app", messagingSenderId: "817262285222", appId: "1:817262285222:web:cabeeb3fe6d9602084bf67", measurementId: "G-CD9WYSNR88" };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const database = firebase.database();

    let currentUser = null;
    let deviceId = null;
    let medicoesRef = null;
    let nivelChart = null;
    let isAdmin = false;

    const tabelaBody = document.getElementById('tabelaBody');
    const canvas = document.getElementById('nivelChart');

    function formatValueWithError(val, err) {
      if (val === undefined || val === null) return '--';
      const v = parseFloat(val).toFixed(2).replace('.', ',');
      if (err === undefined || err === null) return v;
      const e = Math.round(parseFloat(err) * 100);
      return `${v}(${e})`;
    }

    function formatTimestamp(timestamp) {
      if (!timestamp) return '--';
      const date = new Date(timestamp * 1000);
      return isNaN(date.getTime()) ? 'Inválido' : date.toLocaleString('pt-BR', { timeZone: 'UTC' });
    }

    function updateUI(data) {
      if (!data || typeof data !== 'object') {
        tabelaBody.innerHTML = '<tr><td colspan="4" class="px-4 py-8 text-center text-gray-500">Nenhuma medição encontrada</td></tr>';
        if (nivelChart) { nivelChart.destroy(); nivelChart = null; }
        return;
      }

      const timestamps = Object.keys(data).sort((a,b) => Number(b) - Number(a));
      if (timestamps.length === 0) {
        tabelaBody.innerHTML = '<tr><td colspan="4" class="px-4 py-8 text-center text-gray-500">Nenhuma medição encontrada</td></tr>';
        if (nivelChart) { nivelChart.destroy(); nivelChart = null; }
        return;
      }

      // --- Tabela ---
      let html = '';
      for (const ts of timestamps) {
        const med = data[ts];
        const s1_formatted = formatValueWithError(med.sensor1_dist, med.sensor1_desv);
        const s2_formatted = formatValueWithError(med.sensor2_dist, med.sensor2_desv);
        const y_formatted = formatValueWithError(med.nivel_y, med.sigma_y);
        
        html += `
          <tr>
            <td class="px-4 py-2 whitespace-nowrap text-sm text-gray-700">${formatTimestamp(Number(ts))}</td>
            <td class="px-4 py-2 whitespace-nowrap text-sm text-gray-700">${s1_formatted}</td>
            <td class="px-4 py-2 whitespace-nowrap text-sm text-gray-700">${s2_formatted}</td>
            <td class="px-4 py-2 whitespace-nowrap text-sm font-bold text-green-700">${y_formatted}</td>
          </tr>
        `;
      }
      tabelaBody.innerHTML = html;

      // --- Gráfico ---
      const labels = timestamps.reverse().map(ts => formatTimestamp(Number(ts)));
      
      const yData = timestamps.map(ts => data[ts].nivel_y ?? null);
      const yMinData = timestamps.map(ts => {
          const y = data[ts].nivel_y;
          const s = data[ts].sigma_y;
          return (y !== undefined && s !== undefined) ? (y - s) : null;
      });
      const yMaxData = timestamps.map(ts => {
          const y = data[ts].nivel_y;
          const s = data[ts].sigma_y;
          return (y !== undefined && s !== undefined) ? (y + s) : null;
      });

      // DESTRÓI O GRÁFICO ANTERIOR ANTES DE CRIAR UM NOVO
      if (nivelChart) { 
          nivelChart.destroy(); 
          nivelChart = null; 
      }
      
      const ctx = canvas.getContext('2d');
      nivelChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            {
              label: 'Nível y (mm)',
              data: yData,
              borderColor: 'rgb(124, 58, 237)',
              backgroundColor: 'rgba(124, 58, 237, 0.2)',
              borderWidth: 2,
              pointRadius: 3,
              pointHoverRadius: 6,
              fill: false,
              tension: 0.2
            },
            {
              label: 'Limite Superior (+σ)',
              data: yMaxData,
              borderColor: 'transparent',
              backgroundColor: 'rgba(124, 58, 237, 0.2)',
              pointRadius: 0,
              fill: '+1', 
              tension: 0.2
            },
            {
              label: 'Limite Inferior (-σ)',
              data: yMinData,
              borderColor: 'transparent',
              backgroundColor: 'rgba(124, 58, 237, 0.2)',
              pointRadius: 0,
              fill: false,
              tension: 0.2
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              mode: 'index',
              intersect: false,
              callbacks: {
                label: function(context) {
                  if (context.datasetIndex === 0) {
                      const idx = context.dataIndex;
                      const y = yData[idx];
                      const sig = (yMaxData[idx] - yMinData[idx]) / 2;
                      if (y === null) return 'Sem dados';
                      return `Nível: ${y.toFixed(2)} mm (Erro: ±${sig.toFixed(2)})`;
                  }
                  return null;
                }
              }
            }
          },
          scales: {
            x: { ticks: { maxRotation: 45, minRotation: 45, autoSkip: true, maxTicksLimit: 10 } },
            y: { beginAtZero: true, title: { display: true, text: 'Nível y (mm)' } }
          }
        }
      });
    }

    function setupListener() {
      if (medicoesRef) medicoesRef.off();
      if (!deviceId) return;
      medicoesRef = database.ref(`dispositivos/${deviceId}/medicoes`);
      medicoesRef.on('value', (snapshot) => updateUI(snapshot.val()));
    }

    async function checkPermissions(uid, deviceId) {
      try {
        const deviceSnapshot = await database.ref(`users/${uid}/dispositivos/${deviceId}`).once('value');
        if (!deviceSnapshot.exists()) { 
            alert('Acesso negado.'); 
            window.location.href = 'dispositivos.html'; 
            return false; 
        }
        
        const adminSnapshot = await database.ref(`admins/${uid}`).once('value');
        isAdmin = adminSnapshot.val() === true;
        if (isAdmin) document.getElementById('apagarHistoricoBtn').classList.remove('hidden');

        setupListener();
        return true;
      } catch (err) { return false; }
    }

    function apagarHistorico() {
      if (!isAdmin) return;
      if (confirm('ATENÇÃO: Tem certeza que deseja APAGAR TODO o histórico?\n\nEsta ação NÃO PODE ser desfeita.')) {
        const btn = document.getElementById('apagarHistoricoBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Apagando...';
        
        database.ref(`dispositivos/${deviceId}/medicoes`).remove()
          .then(() => alert('Histórico apagado!'))
          .catch(err => alert('Erro: ' + err.message))
          .finally(() => { 
              btn.disabled = false; 
              btn.innerHTML = '<i class="fas fa-trash-alt mr-2"></i> Apagar Histórico'; 
          });
      }
    }

    function exportToCSV() {
      database.ref(`dispositivos/${deviceId}/medicoes`).once('value').then(snapshot => {
        const data = snapshot.val();
        if (!data) { alert('Nenhum dado disponível.'); return; }
        const timestamps = Object.keys(data).sort((a,b) => Number(b) - Number(a));
        
        const rows = [['Data/Hora (UTC)', 'Sensor 1 (mm)', 'Sensor 2 (mm)', 'Nivel y (mm)']];
        for (const ts of timestamps) {
          const med = data[ts];
          rows.push([
            formatTimestamp(Number(ts)),
            formatValueWithError(med.sensor1_dist, med.sensor1_desv),
            formatValueWithError(med.sensor2_dist, med.sensor2_desv),
            formatValueWithError(med.nivel_y, med.sigma_y)
          ]);
        }
        
        const csv = Papa.unparse(rows, { delimiter: ';' });
        const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `medicoes_${deviceId}.csv`;
        link.click();
      });
    }

    auth.onAuthStateChanged(user => {
      if (!user) { window.location.href = 'login.html'; return; }
      currentUser = user;
      const urlParams = new URLSearchParams(window.location.search);
      deviceId = urlParams.get('device');
      
      if (!deviceId) { 
          alert('Nenhum dispositivo selecionado.'); 
          window.location.href = 'dispositivos.html'; 
          return; 
      }
      
      checkPermissions(currentUser.uid, deviceId);
    });

    document.getElementById('refreshBtn').onclick = () => { 
        if (medicoesRef) medicoesRef.once('value', snapshot => updateUI(snapshot.val())); 
    };
    document.getElementById('logoutBtn').onclick = () => auth.signOut().then(() => window.location.href = 'login.html');
    document.getElementById('exportCsvBtn').onclick = exportToCSV;
    document.getElementById('apagarHistoricoBtn').onclick = apagarHistorico;
  </script>
</body>
</html>
